name: Métricas do perfil

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas-perfil
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Histórico de linhas de código
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.linhas.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: buddha-spa
          committer_branch: metrics
          committer_message: "chore: atualizar ${filename}"
          template: classic
          config_timezone: America/Sao_Paulo
          base: ""
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
